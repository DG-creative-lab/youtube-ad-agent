name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-test.txt
      - run: .venv/bin/python -m unittest discover -s tests -v

  planner:
    name: Planner build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.33.0'
          package_json_file: web/planner/package.json
          run_install: false
      - name: Install planner dependencies
        run: pnpm --dir web/planner install --frozen-lockfile
      - name: Type-check and build planner
        run: pnpm --dir web/planner build
