name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check architecture and trusted shrinking baseline
        env:
          ARCH_EVENT: ${{ github.event_name }}
          ARCH_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          case "$ARCH_EVENT" in pull_request|push) ;; *) exit 2 ;; esac
          if git cat-file -e "$ARCH_BASE_SHA:scripts/check_architecture.py" 2>/dev/null; then
            trusted_checker="$(mktemp)"
            git show "$ARCH_BASE_SHA:scripts/check_architecture.py" > "$trusted_checker"
            python3 "$trusted_checker" --root "$GITHUB_WORKSPACE" --base-ref "$ARCH_BASE_SHA"
            rm "$trusted_checker"
          fi
          architecture_report="$RUNNER_TEMP/architecture-debt.json"
          python3 scripts/check_architecture.py --base-ref "$ARCH_BASE_SHA" --format json --details > "$architecture_report" || {
            architecture_exit=$?
            cat "$architecture_report"
            exit "$architecture_exit"
          }
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("architecture:",d["status"],"reviewed debt:",d["active_debt"],"report:",sys.argv[1])' "$architecture_report"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-test.txt
      - run: .venv/bin/python -m unittest discover -s tests -v

  planner:
    name: Planner build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.33.0'
          package_json_file: web/planner/package.json
          run_install: false
      - name: Install planner dependencies
        run: pnpm --dir web/planner install --frozen-lockfile
      - name: Check foreground client invariants
        run: pnpm --dir web/planner test
      - name: Type-check and build planner
        run: pnpm --dir web/planner build
